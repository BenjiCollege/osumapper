[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osumapper"
version = "8.0.0a1"
description = "A maintained osu!lazer modernization of kotritrona's osumapper"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "kotritrona" }]
maintainers = [{ name = "Gerardo (Benji) Colegio" }]
keywords = ["osu", "osu-lazer", "beatmap", "music", "tensorflow", "keras"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Typing :: Typed",
]
dependencies = [
  "librosa>=0.11,<1",
  "matplotlib>=3.9,<4",
  "numpy>=1.26.4,<3",
  "pyarrow>=17,<30",
  "rosu-pp-py==4.0.2",
  "scikit-learn>=1.5,<2",
  "tensorflow>=2.18,<2.21",
  "tf-keras>=2.18,<2.21",
  "tkinterdnd2>=0.4,<1",
]

[project.optional-dependencies]
gpu = [
  "tensorflow[and-cuda]>=2.18,<2.21; sys_platform == 'linux'",
]

[project.urls]
"Original project" = "https://github.com/kotritrona/osumapper"
"Original creator" = "https://github.com/kotritrona"
"Original documentation" = "https://github.com/kotritrona/osumapper/wiki"

[project.scripts]
osumapper = "osumapper.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osumapper"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "ml: requires TensorFlow and runs model compatibility checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["v6.2", "v7.0", ".bootstrap", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
default-groups = ["dev"]
